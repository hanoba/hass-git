notify:
  - name: "email_alarm"
    platform: smtp
    server: "mail.gmx.net"              # <-- Wichtig: Der GMX Server
    port: 587
    encryption: starttls
    timeout: 15
    sender: "home_a@gmx.de"             # GMX Adresse
    username: "home_a@gmx.de"           # Nochmal die GMX Adresse
    password: !secret gmx_password      # GMX Passwort (kein App-Passwort nötig)
    recipient: "harald.n.bauer@web.de"  # Wo soll die Mail ankommen?
    sender_name: "HomeAssistant"

rest_command:
  shutdown_pi_host:
    url: "http://localhost:8080/shutdown_host" # IP deines Pi einsetzen
    method: POST

